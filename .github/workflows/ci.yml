name: ci
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest ] # TODO: ubuntu(timeout) & windows(failed)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install latest CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Fix Linux-specific issues # TODO: check if still necessary
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libltdl-dev build-essential pkg-config ninja-build autoconf autoconf-archive automake libtool

      - name: Setup anew (or from cache) vcpkg (and does not build any package)
        uses: lukka/run-vcpkg@v11
        with:
          configurePreset: release
          buildPreset: release

      - name: Run CMake consuming CMakePreset.json and run vcpkg to build packages
        uses: lukka/run-cmake@v10
        with:
          configurePreset: release
          buildPreset: release

      - name: Run tests
        run: |
          ctest --preset release --output-on-failure
