name: release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish (ex: v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_type: release
            triplet: x64-linux
            artifact_os: linux
            artifact_arch: x64
          - os: macos-latest
            build_type: release
            triplet: arm64-osx
            artifact_os: macos
            artifact_arch: arm64
          - os: windows-latest
            build_type: release
            triplet: x64-windows-static-md
            artifact_os: windows
            artifact_arch: x64

    runs-on: ${{ matrix.os }}

    env:
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
      VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.triplet }}
      VCPKG_BINARY_SOURCES: 'clear'

    steps:
      - uses: actions/checkout@v6

      - name: Install latest CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Fix Linux-specific issues
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt install ninja-build build-essential autoconf autoconf-archive automake libtool libltdl-dev

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'fd3dde77905b1b1890df3c8daa496d9b2fe44f7f'

      - name: Restore vcpkg cache
        id: restore-vcpkg
        uses: actions/cache/restore@v6
        with:
          path: |
            **/vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ matrix.triplet }}-${{ hashFiles('**/vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.triplet }}-

      - name: Configure and build noi_engine as a static library (${{ matrix.build_type }})
        uses: lukka/run-cmake@v10
        with:
          configurePreset: ${{ matrix.build_type }}
          configurePresetAdditionalArgs: "['-DCMAKE_BUILD_SHARED_LIBS=OFF', '-DNOI_ENGINE_BUILD_TESTS=OFF', '-DNOI_ENGINE_BUILD_SANDBOX=OFF']"
          buildPreset: ${{ matrix.build_type }}

      - name: Save vcpkg cache
        if: steps.restore-vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            **/vcpkg_installed
          key: ${{ steps.restore-vcpkg.outputs.cache-primary-key }}

      - name: Package static library and headers
        shell: bash
        run: |
          set -euo pipefail
          PKG_NAME="noi_engine-${{ matrix.artifact_os }}-${{ matrix.artifact_arch }}-${{ matrix.build_type }}"
          PKG_DIR="dist/${PKG_NAME}"
          mkdir -p "${PKG_DIR}/lib" "${PKG_DIR}/include"
          LIB_FILE=$(find "build/${{ matrix.build_type }}/lib" -maxdepth 1 -type f \( -name "*.a" -o -name "*.lib" \) | head -n1)
          cp "${LIB_FILE}" "${PKG_DIR}/lib/"
          cp -r include/noi_engine "${PKG_DIR}/include/"
          tar -C dist -czf "dist/${PKG_NAME}.tar.gz" "${PKG_NAME}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: noi_engine-${{ matrix.artifact_os }}-${{ matrix.artifact_arch }}-${{ matrix.build_type }}
          path: dist/*.tar.gz
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag_name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release with static library attachments
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: ${{ steps.tag.outputs.tag_name }}
          generate_release_notes: true
          files: dist/*.tar.gz
