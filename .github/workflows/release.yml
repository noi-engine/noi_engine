name: release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish (ex: v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_type: release
            triplet: x64-linux
            artifact_os: linux
            artifact_arch: x64
          - os: macos-latest
            build_type: release
            triplet: arm64-osx
            artifact_os: macos
            artifact_arch: arm64
           #- os: windows-latest
            #build_type: release
            #triplet: x64-windows-static-md
            #artifact_os: windows
            #artifact_arch: x64

    runs-on: ${{ matrix.os }}

    env:
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
      VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.triplet }}
      VCPKG_BINARY_SOURCES: 'clear'

    steps:
      - uses: actions/checkout@v6

      - name: Install latest CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Fix Linux-specific issues
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt install ninja-build build-essential autoconf autoconf-archive automake libtool libltdl-dev

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'fd3dde77905b1b1890df3c8daa496d9b2fe44f7f'

      - name: Restore vcpkg cache
        id: restore-vcpkg
        uses: actions/cache/restore@v6
        with:
          path: |
            **/vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ matrix.triplet }}-${{ hashFiles('**/vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.triplet }}-

      - name: Configure and build noi_engine as a shared library (${{ matrix.build_type }})
        uses: lukka/run-cmake@v10
        with:
          configurePreset: ${{ matrix.build_type }}
          configurePresetAdditionalArgs: "['-DCMAKE_BUILD_SHARED_LIBS=ON', '-DNOI_ENGINE_BUILD_TESTS=OFF', '-DNOI_ENGINE_BUILD_SANDBOX=OFF']"
          buildPreset: ${{ matrix.build_type }}

      - name: Save vcpkg cache
        if: steps.restore-vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            **/vcpkg_installed
          key: ${{ steps.restore-vcpkg.outputs.cache-primary-key }}

      - name: Install noi_engine (${{ matrix.build_type }})
        run: cmake --install build/${{ matrix.build_type }} --prefix dist/noi_engine

      - name: Checkout noi_engine_editor preview bridge sources
        uses: actions/checkout@v6
        with:
          repository: noi-engine/noi_engine_editor
          ref: main
          token: ${{ secrets.NOI_ENGINE_EDITOR_PAT }}
          path: noi_engine_editor_bridge_src
          sparse-checkout: |
            bridge

      - name: Configure and build the editor preview bridge (${{ matrix.build_type }})
        run: |
          cmake -S noi_engine_editor_bridge_src/bridge -B build_bridge -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -Dnoi_engine_DIR="${{ github.workspace }}/dist/noi_engine/libs/cmake/noi_engine"
          cmake --build build_bridge

      - name: Bundle the editor preview bridge into the release
        run: |
          mkdir -p dist/noi_engine/editor_bridge
          cp build_bridge/libs/libnoi_engine_editor_bridge.so dist/noi_engine/editor_bridge/

      - name: Package library and headers
        shell: bash
        run: |
          set -euo pipefail

          ZIP_NAME="noi_engine-${{ matrix.artifact_os }}-${{ matrix.artifact_arch }}-${{ matrix.build_type }}.zip"

          (cd dist && zip -r "../${ZIP_NAME}" noi_engine)
          
          mkdir -p final_dist
          mv "${ZIP_NAME}" final_dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: noi_engine-${{ matrix.artifact_os }}-${{ matrix.artifact_arch }}-${{ matrix.build_type }}
          path: final_dist/*.zip
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag_name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release with library attachments
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: ${{ steps.tag.outputs.tag_name }}
          generate_release_notes: true
          files: dist/*.zip